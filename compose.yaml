services:
  dockers-game:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${DOCKERS_BIND_ADDRESS:-0.0.0.0}:${DOCKERS_PORT:-8787}:8787"
    environment:
      DOCKERS_ORIGINS: "${DOCKERS_ORIGINS:-https://danielleurquin.github.io,https://dockersgame.leurquin.org}"
    volumes:
      - dockers-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dockers-data:
